experiences:
  title: Experience
  info:
    - role: Technical Product Owner / Data Engineering Tech Lead
      time: 01/2024 – Present
      company: Promptly Health | Porto, Portugal
      details: |
        - Grew and led a cross-functional data team of up to 9 engineers as Tech Lead, Product Owner, and Engineering Manager, establishing sprint cadences, backlog prioritization, and KPI dashboards using Jira and Agile/Scrum
        - Designed and managed OMOP-CDM harmonization data pipelines (dbt + Dagster) across 20+ data partners in Portugal, Spain, France, and the UK, adapting to diverse data lake environments per partner
        - Led architectural decisions for data infrastructure across heterogeneous setups: cloud data partners with Databricks, Synapse, BigQuery, or AWS Athena; cloud partners without a data lake using StarRocks on object storage; and bare-metal environments with StarRocks on block storage
        - Owned the product roadmap and stakeholder communication, defined and led tender applications, securing new client engagements and expanding the team's project portfolio
        - Established CI/CD pipelines (GitLab CI) and data pipeline best practices for repeatable deployments across client environments

    - role: Data Scientist and Engineer
      time: 06/2022 – 01/2024
      company: Promptly Health | Porto, Portugal
      details: |
        - Designed and built cloud-hosted ETL pipelines in Python and SQL using Apache Airflow, harmonizing healthcare data from 5 data partners into the OMOP-CDM standard
        - Led the EHDEN project end-to-end with a 2-person team: managed client communications, delivered OMOP-CDM mappings for multiple hospital data sources, and ensured compliance with project milestones
        - Served as technical lead for all OMOP-CDM data model implementations, defining mapping standards and review processes adopted across the team
        - Developed R&D prototypes: biometric signal detection from facial video (Python, OpenCV), atrial fibrillation detection from smartphone video, and transformer-based medical vocabulary mapping (PyTorch)

    - role: MSc Thesis Research – Curricular Internship
      time: 09/2021 – 06/2022
      company: INESC Technology and Science | Porto, Portugal
      details: |
        - Developed AI models to predict Traumatic Brain Injury outcomes in ICU patients using Python, scikit-learn, and PyTorch, achieving state-of-the-art AUC on the eICU dataset
        - Implemented explainable AI methods (SHAP, attention visualization) enabling clinicians to interpret and trust model predictions, published as first-author in Frontiers in Neurology
        - Built a multi-modal ML pipeline combining EHR tabular data and physiological time-series using Random Forest, LSTM, and Transformer architectures

    - role: MSc Research – Curricular Internship
      time: 02/2021 – 07/2021
      company: University of Twente / Radboud | Enschede, Netherlands
      details: |
        - Contributed to the PROMPT project on freezing-of-gait detection in Parkinson's patients, conducting multimodal EEG/fNIRS data acquisition during motor and cognitive tasks
        - Developed a MATLAB signal processing pipeline for neuronal reconstruction of finger movement activity from brain signals


header:
  subtitle: "CV & Tech Portfolio"
  tagline: "Technical Product Owner and Data Engineering Lead specializing in healthcare data harmonization and pipeline architecture"

about: |
  Technical Product Owner and Data Engineer with a background in Bioengineering, specializing in healthcare data products.
  I believe healthcare presents enormous opportunities to leverage data for better patient outcomes and more efficient clinical workflows.
  My focus is on extracting value from Real World Data (RWD) by building end-to-end data pipelines — from source systems through harmonization to actionable analytics.
  I'm passionate about bridging the gap between patients, healthcare professionals, and technology.

